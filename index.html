<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Cyber Basics</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Nunito+Sans:ital,opsz,wght@0,6..12,400;0,6..12,700;1,6..12,400&family=JetBrains+Mono:wght@500&display=swap"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>

  <body>
    

    <div class="shell">
      <aside class="rail">
        <div class="brand">
          <small>English · Digital Safety</small><b>Cyber Basics</b>
        </div>
        <span class="note" id="prog-t">0 of 7 lessons completed</span>
        <div class="progress"><i id="prog" style="width: 0%"></i></div>
        <ol class="lessons" id="lessons"></ol>
        <label class="toggle">
          <input type="checkbox" id="es-t" /> Show Spanish help
        </label>
      </aside>
      <main class="panel" id="panel"></main>
    </div>

    <div id="account-control" class="account-control" role="region" aria-label="Course account"></div>

    <script type="module" src="/src/course.js"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
