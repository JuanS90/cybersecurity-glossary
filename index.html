<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Cyber Basics</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Nunito+Sans:ital,opsz,wght@0,6..12,400;0,6..12,700;1,6..12,400&family=JetBrains+Mono:wght@500&display=swap"
    />
    <style>
      body {
        margin: 0;
      }

      [hidden] {
        display: none !important;
      }

      img {
        max-width: 100%;
      }
    </style>
  </head>

  <body>
    <style>
      /* Layout: course shell — lesson rail (sidebar on desktop, scroll strip on phone) + one lesson panel at a time with a practice activity + prev/next; last step is a certificate. */
      :root {
        --bg: #f3f6f5;
        --surface: #ffffff;
        --ink: #122420;
        --muted: #56655f;
        --line: #d5dfdb;
        --accent: #0b7d6b;
        --accent-soft: #dcf1ec;
        --on-accent: #ffffff;
        --flag: #d23a2a;
        --flag-soft: #fde6e2;
        --good: #1f8a4c;
        --good-soft: #dff3e6;
        --warn: #b76a00;
        --warn-soft: #fdf0d9;
        --hl: #fff1a8;
        --scene: #e6f0ec;
        --display: "Bricolage Grotesque", "Segoe UI", sans-serif;
        --body: "Nunito Sans", system-ui, sans-serif;
        --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0e1614;
          --surface: #16211e;
          --ink: #e4eeea;
          --muted: #9db0a9;
          --line: #2a3a35;
          --accent: #4fd1b5;
          --accent-soft: #173a33;
          --on-accent: #08201b;
          --flag: #ff8a7a;
          --flag-soft: #3d1d19;
          --good: #6fdc9a;
          --good-soft: #163424;
          --warn: #f2b45a;
          --warn-soft: #3a2c14;
          --hl: #51481a;
          --scene: #111c19;
          color-scheme: dark;
        }
      }

      :root[data-theme="dark"] {
        --bg: #0e1614;
        --surface: #16211e;
        --ink: #e4eeea;
        --muted: #9db0a9;
        --line: #2a3a35;
        --accent: #4fd1b5;
        --accent-soft: #173a33;
        --on-accent: #08201b;
        --flag: #ff8a7a;
        --flag-soft: #3d1d19;
        --good: #6fdc9a;
        --good-soft: #163424;
        --warn: #f2b45a;
        --warn-soft: #3a2c14;
        --hl: #51481a;
        --scene: #111c19;
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        background: var(--bg);
        color: var(--ink);
        font-family: var(--body);
        font-size: 17px;
        line-height: 1.55;
      }

      .shell {
        max-width: 1120px;
        margin: 0 auto;
        padding-inline: 16px;
        padding-block: 24px 56px;
        display: grid;
        grid-template-columns: 260px minmax(0, 1fr);
        gap: 28px;
        align-items: start;
      }

      @media (max-width: 820px) {
        .shell {
          grid-template-columns: minmax(0, 1fr);
        }
      }

      .brand {
        display: grid;
        gap: 2px;
        margin-bottom: 14px;
      }

      .brand small {
        font: 500 12px var(--mono);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--accent);
      }

      .brand b {
        font: 800 30px/1 var(--display);
      }

      .rail {
        position: sticky;
        top: calc(16px + env(safe-area-inset-top, 0px));
      }

      @media (max-width: 820px) {
        .rail {
          position: static;
        }
      }

      .progress {
        height: 8px;
        background: var(--line);
        border-radius: 4px;
        overflow: hidden;
        margin-block: 4px 14px;
      }

      .progress i {
        display: block;
        height: 100%;
        background: var(--accent);
        transition: width 0.4s;
      }

      .lessons {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 4px;
      }

      @media (max-width: 820px) {
        .lessons {
          display: flex;
          overflow-x: auto;
          gap: 6px;
          padding-bottom: 6px;
        }
      }

      .lessons button {
        width: 100%;
        display: flex;
        gap: 10px;
        align-items: center;
        text-align: left;
        font: 600 15px var(--body);
        color: var(--ink);
        background: transparent;
        border: 1px solid transparent;
        border-radius: 10px;
        padding: 9px 10px;
        cursor: pointer;
      }

      @media (max-width: 820px) {
        .lessons button {
          white-space: nowrap;
          border-color: var(--line);
          background: var(--surface);
        }
      }

      .lessons button:hover {
        background: var(--surface);
      }

      .lessons button[aria-current="step"] {
        background: var(--surface);
        border-color: var(--accent);
      }

      .lessons .n {
        flex: none;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font: 500 13px var(--mono);
        border: 1.5px solid var(--line);
        color: var(--muted);
      }

      .lessons .done .n {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--on-accent);
      }

      .toggle {
        margin-top: 14px;
        display: flex;
        gap: 8px;
        align-items: center;
        font-size: 15px;
        color: var(--muted);
        cursor: pointer;
      }

      @media (max-width: 820px) {
        .toggle {
          margin-top: 8px;
        }
      }

      .panel {
        display: grid;
        gap: 22px;
        min-width: 0;
      }

      .lesson-head {
        display: grid;
        gap: 6px;
      }

      .eyebrow {
        font: 500 12px var(--mono);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--accent);
      }

      h1 {
        font: 800 clamp(32px, 5.5vw, 52px)/1.02 var(--display);
        margin: 0;
        text-wrap: balance;
      }

      h2 {
        font: 700 24px/1.15 var(--display);
        margin: 0;
        text-wrap: balance;
      }

      h3 {
        font: 700 19px var(--display);
        margin: 0;
      }

      .lead {
        font-size: 19px;
        color: var(--muted);
        margin: 0;
        max-width: 62ch;
      }

      .prose {
        display: grid;
        gap: 12px;
        max-width: 66ch;
      }

      .prose p {
        margin: 0;
      }

      .box {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 20px;
        display: grid;
        gap: 14px;
        min-width: 0;
      }

      .activity {
        border: 2px solid var(--accent);
      }

      .activity > .eyebrow::before {
        content: "✎ ";
      }

      .v {
        font: inherit;
        font-weight: 700;
        color: inherit;
        background: linear-gradient(transparent 60%, var(--accent-soft) 60%);
        border: 0;
        padding: 0 1px;
        cursor: help;
        position: relative;
      }

      .v .es {
        display: none;
      }

      body.es .v .es {
        display: inline;
        font-weight: 400;
        font-style: italic;
        color: var(--muted);
        font-size: 0.85em;
        margin-left: 3px;
      }

      body.es .v .es::before {
        content: "(";
      }

      body.es .v .es::after {
        content: ")";
      }

      .words {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .word {
        font-size: 14px;
        border: 1px solid var(--line);
        border-radius: 99px;
        padding: 4px 12px;
        background: var(--bg);
      }

      .word b {
        font-weight: 700;
      }

      .word i {
        color: var(--muted);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
        gap: 12px;
      }

      .grid.g3 {
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      }

      .mini {
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px;
        display: grid;
        gap: 6px;
        align-content: start;
      }

      .mini p {
        margin: 0;
        font-size: 15px;
      }

      .mini .lbl {
        font: 500 11px var(--mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .btn {
        font: 700 15px var(--body);
        padding: 10px 18px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--ink);
        cursor: pointer;
      }

      .btn.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--on-accent);
      }

      .btn:disabled {
        opacity: 0.45;
        cursor: default;
      }

      button:focus-visible,
      input:focus-visible,
      label:focus-within {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .nav {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
        border-top: 1px solid var(--line);
        padding-top: 18px;
      }

      .opts {
        display: grid;
        gap: 8px;
      }

      .opt {
        font: 600 16px var(--body);
        text-align: left;
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: var(--bg);
        color: var(--ink);
        cursor: pointer;
      }

      .opt.right {
        border-color: var(--good);
        background: var(--good-soft);
      }

      .opt.wrong {
        border-color: var(--flag);
        background: var(--flag-soft);
      }

      .fb {
        margin: 0;
        font-weight: 700;
        min-height: 1.5em;
      }

      .fb.good {
        color: var(--good);
      }

      .fb.bad {
        color: var(--flag);
      }

      /* password meter */
      .pw {
        font: 500 18px var(--mono);
        width: 100%;
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: var(--bg);
        color: var(--ink);
      }

      .meter {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
      }

      .meter i {
        height: 10px;
        border-radius: 5px;
        background: var(--line);
      }

      .checks {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 4px;
        font-size: 15px;
      }

      .checks li::before {
        content: "○ ";
        color: var(--muted);
      }

      .checks li.ok::before {
        content: "● ";
        color: var(--good);
      }

      .verdict {
        font: 700 18px var(--display);
        margin: 0;
      }

      .note {
        font-size: 14px;
        color: var(--muted);
        margin: 0;
      }

      /* email */
      .mail {
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
      }

      .mail-h {
        padding: 12px 16px;
        border-bottom: 1px solid var(--line);
        display: grid;
        gap: 2px;
        font-size: 15px;
      }

      .mail-h .from {
        font-family: var(--mono);
        font-size: 14px;
        word-break: break-all;
      }

      .mail-b {
        padding: 16px;
        display: grid;
        gap: 10px;
      }

      .mail-b p {
        margin: 0;
      }

      .flag {
        font: inherit;
        color: inherit;
        background: transparent;
        border: 0;
        border-bottom: 2px dotted var(--muted);
        padding: 0;
        cursor: pointer;
        text-align: inherit;
      }

      .flag.found {
        background: var(--flag-soft);
        border-bottom: 2px solid var(--flag);
        color: var(--ink);
      }

      .fakebtn {
        display: inline-block;
        background: var(--flag);
        color: var(--surface);
        font-weight: 700;
        border-radius: 8px;
        padding: 8px 14px;
        border-bottom: 0;
      }

      .fakebtn.found {
        background: var(--flag);
        color: var(--surface);
        outline: 3px solid var(--flag-soft);
      }

      .found-list {
        margin: 0;
        padding-left: 1.2em;
        display: grid;
        gap: 6px;
        font-size: 15px;
      }

      .found-list b {
        color: var(--flag);
      }

      .chipbar {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }

      .pill {
        font: 500 13px var(--mono);
        padding: 4px 10px;
        border-radius: 99px;
        background: var(--accent-soft);
        color: var(--ink);
        font-variant-numeric: tabular-nums;
      }

      /* sms sort */
      .sms {
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 16px 16px 16px 4px;
        padding: 12px 14px;
        max-width: 46ch;
        font-size: 16px;
      }

      .sms small {
        display: block;
        font: 500 12px var(--mono);
        color: var(--muted);
        margin-bottom: 4px;
      }

      .two {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .tagline {
        font: 500 12px var(--mono);
        padding: 2px 8px;
        border-radius: 99px;
      }

      .tagline.bad {
        background: var(--flag-soft);
        color: var(--flag);
      }

      .tagline.good {
        background: var(--good-soft);
        color: var(--good);
      }

      .tagline.warn {
        background: var(--warn-soft);
        color: var(--warn);
      }

      /* post or not */
      .posts {
        display: grid;
        gap: 10px;
      }

      .post {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 10px;
        align-items: center;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px 14px;
      }

      .post p {
        margin: 0;
      }

      .post .why {
        grid-column: 1/-1;
        font-size: 14px;
        color: var(--muted);
      }

      .post .act {
        display: flex;
        gap: 6px;
      }

      .sm {
        font: 700 13px var(--body);
        padding: 6px 10px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--ink);
        cursor: pointer;
      }

      /* certificate */
      .cert {
        border: 3px double var(--accent);
        border-radius: 16px;
        padding: 32px 22px;
        text-align: center;
        display: grid;
        gap: 10px;
        background: var(--surface);
      }

      .cert .big {
        font: 800 clamp(28px, 6vw, 46px)/1.05 var(--display);
        margin: 0;
      }

      .cert .name {
        font: 700 clamp(24px, 5vw, 34px) var(--display);
        color: var(--accent);
        border-bottom: 2px solid var(--line);
        padding-bottom: 6px;
        margin-inline: auto;
        min-width: min(320px, 100%);
      }

      .cert ul {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 6px 14px;
        font-size: 15px;
        color: var(--muted);
      }

      .row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
      }

      .row input {
        flex: 1 1 220px;
        min-width: 0;
        font: 17px var(--body);
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: var(--bg);
        color: var(--ink);
      }

      table {
        border-collapse: collapse;
        width: 100%;
        font-size: 15px;
      }

      td,
      th {
        padding: 8px 10px;
        border-bottom: 1px solid var(--line);
        text-align: left;
        vertical-align: top;
      }

      th {
        font: 500 12px var(--mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .tw {
        overflow-x: auto;
      }

      /* ===== animated scenes */
      .scene {
        margin: 0;
        background: var(--scene);
        border: 1px solid var(--line);
        border-radius: 14px;
        overflow: hidden;
      }

      .scene .stage {
        overflow-x: auto;
      }

      .scene svg {
        display: block;
        width: 100%;
        min-width: 480px;
        height: auto;
        fill: var(--ink);
      }

      .scene svg text {
        font-family: var(--body);
        font-weight: 700;
        font-size: 15px;
      }

      .scene figcaption {
        padding: 10px 14px;
        font-size: 15px;
        color: var(--muted);
        border-top: 1px solid var(--line);
        display: flex;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
      }

      .scene figcaption span {
        flex: 1 1 260px;
        min-width: 0;
      }

      .scene.paused * {
        animation-play-state: paused !important;
      }

      .fs {
        fill: var(--surface);
      }

      .fa {
        fill: var(--accent);
      }

      .fas {
        fill: var(--accent-soft);
      }

      .ff {
        fill: var(--flag);
      }

      .ffs {
        fill: var(--flag-soft);
      }

      .fg {
        fill: var(--good);
      }

      .fw {
        fill: var(--warn);
      }

      .fi {
        fill: var(--ink);
      }

      .fl {
        fill: var(--line);
      }

      .fm {
        fill: var(--muted);
      }

      .fn {
        fill: none;
      }

      .si {
        stroke: var(--ink);
        stroke-width: 2.5;
      }

      .sa {
        stroke: var(--accent);
      }

      .sf {
        stroke: var(--flag);
      }

      .sg {
        stroke: var(--good);
      }

      .ss {
        stroke: var(--surface);
      }

      .sl {
        stroke: var(--line);
      }

      .mono {
        font-family: var(--mono) !important;
        font-weight: 500 !important;
      }

      /* S1 shield */
      .ring {
        transform-box: fill-box;
        transform-origin: center;
        animation: spin 18s linear infinite;
      }

      .pulse {
        animation: pulse 2.4s ease-in-out infinite;
      }

      .atk {
        opacity: 0;
        animation: atk 4s linear infinite both;
      }

      .msgp {
        animation: msgp 4s ease-in 0.5s infinite both;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }

        50% {
          opacity: 0.45;
        }
      }

      @keyframes atk {
        0% {
          transform: translate(var(--x0), var(--y0)) scale(1);
          opacity: 0;
        }

        10% {
          opacity: 1;
        }

        50% {
          transform: translate(var(--x1), var(--y1)) scale(1);
          opacity: 1;
        }

        62%,
        100% {
          transform: translate(var(--x1), var(--y1)) scale(2);
          opacity: 0;
        }
      }

      @keyframes msgp {
        0% {
          transform: translate(300px, 260px);
        }

        70%,
        100% {
          transform: translate(300px, 140px);
        }
      }

      /* S2 brute force */
      .bf {
        padding: 18px 16px;
        display: grid;
        gap: 16px;
      }

      .lane {
        display: grid;
        gap: 8px;
      }

      .lane-h {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
      }

      .lane-h .lbl {
        font: 500 12px var(--mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .lane .st {
        font: 700 14px var(--body);
        font-variant-numeric: tabular-nums;
      }

      .lane .st.bad {
        color: var(--flag);
      }

      .lane .st.good {
        color: var(--good);
      }

      .slotrow {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        align-items: center;
      }

      .ch {
        width: 24px;
        height: 32px;
        display: grid;
        place-items: center;
        font: 500 17px var(--mono);
        border-radius: 5px;
        background: var(--surface);
        border: 1px solid var(--line);
        color: var(--muted);
      }

      .ch.fix {
        color: var(--ink);
        border-color: var(--flag);
        background: var(--flag-soft);
      }

      .scene svg.lock {
        width: 30px;
        min-width: 0;
        height: 34px;
        margin-left: 8px;
        flex: none;
      }

      .robot {
        font: 500 13px var(--mono);
        color: var(--muted);
      }

      /* S3 fish */
      .wave {
        animation: wave 3s linear infinite;
      }

      .bait {
        animation: bait 9s ease-out infinite both;
      }

      .fish {
        animation: fish 9s ease-in-out infinite both;
      }

      .qm {
        opacity: 0;
        animation: qm 9s infinite both;
      }

      .hook {
        opacity: 0;
        animation: hook 9s infinite both;
      }

      @keyframes wave {
        to {
          transform: translateX(-120px);
        }
      }

      @keyframes bait {
        0% {
          transform: translateY(-170px);
        }

        14%,
        92% {
          transform: translateY(0);
        }

        100% {
          transform: translateY(-170px);
        }
      }

      function bindGlossary(q0) {
        let kind = "all";
        const norm = (s) =>
          s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
        const gid = (t) => "g-" + t.toLowerCase().replace(/[^a-z0-9]+/g, "-");
        const draw = () => {
          const q = norm($("gq").value.trim());
          const list = G.filter(
            (g) =>
              (kind === "all" || g.k === kind) &&
              (!q || norm(g.t + " " + g.es + " " + g.d).includes(q)),
          ).sort(
            (a, b) =>
              (q && norm(a.t).startsWith(q) ? 0 : 1) -
                (q && norm(b.t).startsWith(q) ? 0 : 1) ||
              a.t.localeCompare(b.t),
          );
          $("gcount").textContent =
            `${list.length} ${list.length === 1 ? "word" : "words"}` +
            (q ? ` for “${$("gq").value.trim()}”` : "");
          $("glist").innerHTML = list.length
            ? list
                .map(
                  (g) =>
                    `<article class="gi${q && norm(g.t).startsWith(q) ? " hit" : ""}" id="${gid(g.t)}"><div class="meta"><span class="kind ${g.k}">${g.k === "t" ? "Threat" : "Security tool"}</span><span class="pg">Threatsaurus p. ${g.p}</span></div><h3>${g.t}</h3><span class="es">${g.es}</span><p>${g.d}</p></article>`,
                )
                .join("")
            : `<p class="note">No words found. Try another word, in English or Spanish.</p>`;
          const letters = [...new Set(list.map((g) => g.t[0].toUpperCase()))];
          $("gl").innerHTML = letters
            .map((L) => `<button type="button" data-l="${L}">${L}</button>`)
            .join("");
          $("gl")
            .querySelectorAll("button")
            .forEach(
              (b) =>
                (b.onclick = () => {
                  const el = [...$("glist").children].find(
                    (a) =>
                      a.querySelector("h3").textContent[0].toUpperCase() ===
                      b.dataset.l,
                  );
                  if (el)
                    el.scrollIntoView({
                      behavior: RM ? "auto" : "smooth",
                      block: "start",
                    });
                }),
            );
        };
        $("gq").value = q0;
        $("gq").oninput = draw;
        document.querySelectorAll(".chip2").forEach(
          (c) =>
            (c.onclick = () => {
              kind = c.dataset.k;
              document
                .querySelectorAll(".chip2")
                .forEach((x) => x.setAttribute("aria-pressed", x === c));
              draw();
            }),
        );
        draw();
      }

      function confetti() {
        if (RM) return;
        const cv = document.createElement("canvas");
        cv.setAttribute("aria-hidden", "true");
        cv.style.cssText =
          "position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50";
        document.body.appendChild(cv);
        const ctx = cv.getContext("2d"),
          dpr = window.devicePixelRatio || 1;
        const W = (cv.width = innerWidth * dpr),
          H = (cv.height = innerHeight * dpr);
        const cs = getComputedStyle(document.documentElement);
        const cols = ["--accent", "--flag", "--warn", "--good"].map((v) =>
          cs.getPropertyValue(v).trim(),
        );
        const P = Array.from({ length: 160 }, () => ({
          x: Math.random() * W,
          y: -Math.random() * H * 0.6,
          vx: (Math.random() - 0.5) * 3 * dpr,
          vy: (2 + Math.random() * 4) * dpr,
          r: Math.random() * 6.28,
          vr: (Math.random() - 0.5) * 0.3,
          s: (5 + Math.random() * 6) * dpr,
          c: cols[Math.floor(Math.random() * cols.length)],
        }));
        const t0 = performance.now();
        const step = (now) => {
          ctx.clearRect(0, 0, W, H);
          P.forEach((p) => {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.05 * dpr;
            p.r += p.vr;
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.r);
            ctx.fillStyle = p.c;
            ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
            ctx.restore();
          });
          if (now - t0 < 4000) requestAnimationFrame(step);
          else cv.remove();
        };
        requestAnimationFrame(step);
      }
      go(0);
